# Klondike Solitaire settings.
#
# Every setting below is shown with its default value and starts with #, so it is NOT active: the program uses the
# default from src/main/resources/default.properties.
# To change a setting, remove the # at the start of its line and edit the value, then run the program again.
# There is no need to rebuild. Only the lines without # replace their defaults.
#
# The program reads this file from the folder it is started from (the project folder).

# Solver limits for one automatic game. Every game ends when one of them is reached.
#solver.maxMoves=3000
# Time limit in milliseconds (10000 = 10 seconds).
#solver.maxMillis=10000

# Games played by "simulate" and "compare" when no count is given.
#simulation.defaultGameCount=100
# Highest number of games the menu accepts for "Test win rate".
#simulation.maxGameCount=100

# Folder searched when only a card file name is typed, such as input.txt.
#cardFiles.folder=card-files
