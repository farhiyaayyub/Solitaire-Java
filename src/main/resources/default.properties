# Default settings of Klondike Solitaire. This file is packaged with the program; do not edit it to change a
# setting. Change solitaire.properties in the project folder instead: any value there replaces the one here.
#
# This file also defines which settings exist. A name in solitaire.properties that is not listed here is
# reported as an unknown setting, so a misspelled name is never ignored silently.

# Solver limits for one automatic game. Every game ends when one of them is reached.
solver.maxMoves=3000
# Time limit in milliseconds (10000 = 10 seconds).
solver.maxMillis=10000

# Games played by "simulate" and "compare" when no count is given.
simulation.defaultGameCount=100
# Highest number of games the menu accepts for "Test win rate".
simulation.maxGameCount=100
# Seed used by "random", "simulate", "compare", and "manual" when no seed is given.
simulation.defaultSeed=0

# Folder searched when only a card file name is typed, such as input.txt.
cardFiles.folder=card-files
